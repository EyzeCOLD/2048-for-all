<!DOCTYPE html>
<html>
	<head>
		<title>2048</title>
		<link rel="stylesheet" href="style.css">
		<script src="game.js" defer></script>
		<script src="main.js" defer></script>
	</head>
	<body>
		<div id="app"></div>
		<div id="startScreenOverlay" class="overlay show">
			<div class="popup">
				<h2>2048</h2>
				<p>
				Move the tiles with arrow keys or by swiping.<br><br>
				When two tiles of equal value collide, they combine.<br><br>
				After every move a new tile appears in an empty space.<br><br>
				The game ends when there are no possible moves left.<br><br>
				Try getting to <strong>2048</strong> or beyond!
				</p>
				<button id="startButton">Start</button>
			</div>
		</div>
		<div id="gameOverOverlay" class="overlay">
			<div class="popup">
				<h2>Game Over</h2>
				<button id="retryButton">Play again</button>
			</div>
		</div>
	</body>
</html>
